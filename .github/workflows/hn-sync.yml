name: HN Sync - Pro Clinic to Supabase

on:
  schedule:
    # Every day at 03:00 ICT (20:00 UTC previous day)
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      full_sync:
        description: 'Full sync (re-fetch all customers)'
        required: false
        type: boolean
        default: false
      resume_from:
        description: 'Resume from page number (e.g. 9500)'
        required: false
        type: string
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r hn_sync/requirements.txt

      - name: Restore sync state cache
        uses: actions/cache@v4
        with:
          path: hn_sync/sync_state.json
          key: hn-sync-state-${{ github.run_id }}
          restore-keys: hn-sync-state-

      - name: Create .env file
        run: |
          cat > hn_sync/.env <<EOF
          PROCLINIC_EMAIL=${{ secrets.PROCLINIC_EMAIL }}
          PROCLINIC_PASSWORD=${{ secrets.PROCLINIC_PASSWORD }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
          EOF
          sed -i 's/^          //' hn_sync/.env

      - name: Write cookies from secret (base64 encoded)
        env:
          COOKIES_B64: ${{ secrets.PROCLINIC_COOKIES_B64 }}
        run: python -c "import os,base64; open('hn_sync/cookies.json','wb').write(base64.b64decode(os.environ['COOKIES_B64']))"

      - name: Write sync state from secret (skip full re-fetch)
        env:
          STATE_B64: ${{ secrets.SYNC_STATE_B64 }}
        run: |
          if [ -n "$STATE_B64" ] && [ ! -f hn_sync/sync_state.json ]; then
            python -c "import os,base64; open('hn_sync/sync_state.json','wb').write(base64.b64decode(os.environ['STATE_B64']))"
          fi

      - name: Run HN Sync
        run: |
          cd hn_sync
          if [ -n "${{ inputs.resume_from }}" ]; then
            python -u sync.py --from=${{ inputs.resume_from }}
          elif [ "${{ inputs.full_sync }}" = "true" ]; then
            python -u sync.py --full
          else
            python -u sync.py
          fi

      - name: Save sync state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: hn_sync/sync_state.json
          key: hn-sync-state-${{ github.run_id }}
